<div class="{{ lebar }}">
    <label for="{{ f.id_for_label }}" class="form-label fw-semibold">{{ f.label }}</label>
    {{ f }}
    {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
    {% for g in f.errors %}<div class="text-danger small">{{ g }}</div>{% endfor %}
</div>
