{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block judul %}Beranda{% endblock %} | EkoBBM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'prediksi/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-eko sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'beranda' %}">
                <i class="bi bi-fuel-pump-fill me-2"></i>EkoBBM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama"
                    aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'beranda' %}active{% endif %}" href="{% url 'beranda' %}">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'prediksi' %}active{% endif %}" href="{% url 'prediksi' %}">Prediksi</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'grafik' %}active{% endif %}" href="{% url 'grafik' %}">Grafik</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block isi %}{% endblock %}
    </main>

    <footer class="footer-eko py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>EkoBBM &middot; Proyek Sistem Cerdas, Politeknik Negeri Madiun</span>
            <span>Arjuna Anggara Putra &middot; NIM 253307052</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block skrip %}{% endblock %}
</body>
</html>
